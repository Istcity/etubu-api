appId: com.etubu.app
---
# Premium unlocked + rota: şehir/yer (ilçe nag yok), planla, özet kartı
# Sim GPS gerekli — yoksa "Konum gerekli" ile plan düşer (suite: simctl location set).
# Landscape klavye plan düğmesini örter — suite başında portrait zorunlu.
- launchApp:
    clearState: true
    permissions:
      all: allow
      notifications: deny
    arguments:
      etubuSkipOnboarding: true
      etubuForcePremium: true
- setOrientation: PORTRAIT
- runFlow: setup-legal.yaml
- extendedWaitUntil:
    visible:
      id: "etubu.route.open"
    timeout: 8000
- assertVisible:
    id: "etubu.tpms.grid"
- tapOn:
    id: "etubu.route.open"
- extendedWaitUntil:
    visible:
      id: "etubu.route.picker"
    timeout: 12000
- assertNotVisible: "Etubu Premium"
- extendedWaitUntil:
    visible:
      id: "etubu.route.to"
    timeout: 8000
- assertNotVisible: "Konum gerekli.*"
- tapOn:
    id: "etubu.route.to"
- eraseText
- inputText: "Corum"
- assertNotVisible: ".*ilçe seçin.*"
- extendedWaitUntil:
    visible:
      id: "etubu.route.suggestion.first"
    timeout: 20000
# Go/Enter → onSubmit planRoute (canPlanRoute: ≥2 karakter)
- pressKey: Enter
- extendedWaitUntil:
    visible:
      id: "etubu.route.active"
    timeout: 90000
- assertVisible:
    id: "etubu.route.active"
- assertVisible:
    text: ".*Buradan.*"
- assertNotVisible: ".*ilçe seçin.*"
- takeScreenshot: qa-route-planned
- tapOn: "Kapat"
- extendedWaitUntil:
    visible: "km/h"
    timeout: 8000
