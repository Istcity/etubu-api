appId: com.etubu.app
---
- launchApp:
    clearState: true
    permissions:
      all: allow
      notifications: deny
    arguments:
      etubuSkipOnboarding: true
- runFlow: dismiss-permissions.yaml
- extendedWaitUntil:
    visible:
      id: "etubu.legal.checkbox"
    timeout: 20000
- tapOn:
    id: "etubu.legal.checkbox"
    optional: true
- tapOn:
    id: "etubu.legal.accept"
    optional: true
- tapOn:
    point: "50%,90%"
    optional: true
- runFlow: dismiss-permissions.yaml
- extendedWaitUntil:
    visible: "km/h"
    timeout: 25000
- tapOn:
    id: "etubu.settings.open"
- extendedWaitUntil:
    visible: "Uygulama hakkında"
    timeout: 10000
- scrollUntilVisible:
    element:
      id: "etubu.demo.toggle"
    direction: DOWN
    timeout: 16000
- tapOn:
    id: "etubu.demo.toggle"
- waitForAnimationToEnd:
    timeout: 2000
- extendedWaitUntil:
    visible:
      id: "etubu.gear"
    timeout: 8000
- assertVisible:
    text: "D"
    id: "etubu.gear"
- assertVisible:
    id: "etubu.speed"
- extendedWaitUntil:
    visible: "Radar"
    timeout: 10000
- assertVisible: "YOL UYARILARI"
- assertVisible:
    id: "etubu.demo.stop"
- assertVisible:
    id: "etubu.sound.on"
- takeScreenshot: demo-drive-live
- tapOn:
    id: "etubu.sound.on"
- waitForAnimationToEnd:
    timeout: 2000
- assertVisible:
    id: "etubu.sound.off"
- takeScreenshot: demo-drive-muted
