appId: com.etubu.app
---
- launchApp:
    clearState: true
    permissions:
      all: allow
      notifications: deny
    arguments:
      etubuSkipOnboarding: true
      etubuForcePremium: true
      etubuForceLangTr: true
- setOrientation: PORTRAIT
- runFlow: setup-legal.yaml
- tapOn:
    id: "etubu.settings.open"
- runFlow: scroll-to-demo.yaml
- tapOn:
    id: "etubu.demo.toggle"
- waitForAnimationToEnd:
    timeout: 1500
- tapOn:
    id: "etubu.settings.done"
    optional: true
- tapOn:
    text: "Tamam"
    optional: true
- tapOn:
    text: "Done"
    optional: true
- swipe:
    direction: DOWN
    optional: true
- waitForAnimationToEnd:
    timeout: 2500
- extendedWaitUntil:
    visible:
      id: "etubu.gear"
    timeout: 8000
- assertVisible:
    text: "D"
    id: "etubu.gear"
- extendedWaitUntil:
    visible:
      id: "etubu.ev.arrivalSoc"
    timeout: 15000
- assertVisible:
    id: "etubu.ev.portraitStrip"
- assertVisible:
    id: "etubu.route.openMaps"
- extendedWaitUntil:
    visible:
      id: "etubu.ev.chargeSuggest"
    timeout: 10000
    optional: true
- takeScreenshot: ev-plan-demo-portrait
- tapOn:
    id: "etubu.settings.open"
- scrollUntilVisible:
    element:
      id: "etubu.settings.evRoutePlan"
    direction: DOWN
    timeout: 25000
    speed: 40
    visibilityPercentage: 40
- assertVisible:
    id: "etubu.settings.evRoutePlan"
- assertVisible: "Varışta en az şarj"
- tapOn:
    id: "etubu.settings.done"
    optional: true
- tapOn:
    text: "Tamam"
    optional: true
- swipe:
    direction: DOWN
    optional: true
- waitForAnimationToEnd:
    timeout: 1500
- tapOn:
    id: "etubu.demo.stop"
- waitForAnimationToEnd:
    timeout: 1500
- assertNotVisible:
    id: "etubu.demo.stop"
# Demo stop keeps EV sound preference (armed on start → still on)
- assertVisible:
    id: "etubu.sound.on"
- takeScreenshot: ev-plan-demo-stopped
