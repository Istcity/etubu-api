appId: com.etubu.app
---
- launchApp:
    clearState: true
    permissions:
      all: allow
      notifications: deny
    arguments:
      etubuSkipOnboarding: true
- runFlow: dismiss-permissions.yaml
- extendedWaitUntil:
    visible:
      id: "etubu.legal.checkbox"
    timeout: 20000
- tapOn:
    id: "etubu.legal.checkbox"
- tapOn:
    id: "etubu.legal.accept"
    optional: true
- tapOn:
    point: "50%,92%"
    optional: true
- waitForAnimationToEnd:
    timeout: 2000
- runFlow: dismiss-permissions.yaml
- runFlow:
    when:
      visible:
        id: "etubu.sim.skip"
    commands:
      - tapOn:
          id: "etubu.sim.skip"
      - waitForAnimationToEnd:
          timeout: 1500
- extendedWaitUntil:
    visible:
      id: "etubu.settings.open"
    timeout: 25000
- tapOn:
    id: "etubu.settings.open"
- extendedWaitUntil:
    visible: "Uygulama hakkında"
    timeout: 10000
- scrollUntilVisible:
    element:
      id: "etubu.demo.toggle"
    direction: DOWN
    timeout: 16000
- tapOn:
    id: "etubu.demo.toggle"
- waitForAnimationToEnd:
    timeout: 1500
- tapOn:
    id: "etubu.settings.done"
    optional: true
- tapOn:
    text: "Tamam"
    optional: true
- tapOn:
    text: "Done"
    optional: true
- swipe:
    direction: DOWN
    optional: true
- waitForAnimationToEnd:
    timeout: 2500
- extendedWaitUntil:
    visible:
      id: "etubu.gear"
    timeout: 8000
- assertVisible:
    text: "D"
    id: "etubu.gear"
- extendedWaitUntil:
    visible:
      id: "etubu.ev.arrivalSoc"
    timeout: 15000
- assertVisible:
    id: "etubu.ev.portraitStrip"
- assertVisible:
    id: "etubu.route.openMaps"
- extendedWaitUntil:
    visible:
      id: "etubu.ev.chargeSuggest"
    timeout: 10000
    optional: true
- takeScreenshot: ev-plan-demo-portrait
- tapOn:
    id: "etubu.settings.open"
- scrollUntilVisible:
    element: "EV rota planı"
    direction: DOWN
    timeout: 12000
- assertVisible: "EV rota planı"
- tapOn:
    id: "etubu.settings.done"
    optional: true
- tapOn:
    text: "Tamam"
    optional: true
- swipe:
    direction: DOWN
    optional: true
- waitForAnimationToEnd:
    timeout: 1500
- tapOn:
    id: "etubu.demo.stop"
- waitForAnimationToEnd:
    timeout: 1500
- assertNotVisible:
    id: "etubu.demo.stop"
- assertVisible:
    id: "etubu.sound.off"
- takeScreenshot: ev-plan-demo-stopped
