appId: com.etubu.app
---
# Ortak: sistem izin diyaloglarını kapat (legal checkbox üstünü örtmesin).
# Önce “kullanırken” — “İzin Ver” alt dizgi eşleşmesi “İzin Verme”ye basmasın.
- runFlow:
    when:
      visible: "Allow While Using App"
    commands:
      - tapOn: "Allow While Using App"
- runFlow:
    when:
      visible: "Uygulamayı Kullanırken İzin Ver"
    commands:
      - tapOn: "Uygulamayı Kullanırken İzin Ver"
- runFlow:
    when:
      visible: "Allow Once"
    commands:
      - tapOn: "Allow While Using App"
- runFlow:
    when:
      visible: "Bir Kez İzin Ver"
    commands:
      - tapOn: "Uygulamayı Kullanırken İzin Ver"
- runFlow:
    when:
      visible: "Don't Allow"
    commands:
      - tapOn: "Don't Allow"
- runFlow:
    when:
      visible: "İzin Verme"
    commands:
      - tapOn: "İzin Verme"
- runFlow:
    when:
      visible: "İzin Ver"
    commands:
      - tapOn: "İzin Ver"
