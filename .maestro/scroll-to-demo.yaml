appId: com.etubu.app
---
# Settings → Demo toggle (Uygulama grubu, dil satırlarının hemen altında).
- extendedWaitUntil:
    visible:
      id: "etubu.settings.done"
    timeout: 10000
- runFlow:
    when:
      notVisible:
        id: "etubu.demo.toggle"
    commands:
      - scrollUntilVisible:
          element:
            id: "etubu.demo.toggle"
          direction: DOWN
          timeout: 25000
          speed: 35
          visibilityPercentage: 25
          centerElement: false
- extendedWaitUntil:
    visible:
      id: "etubu.demo.toggle"
    timeout: 8000
