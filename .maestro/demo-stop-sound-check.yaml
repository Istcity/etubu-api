appId: com.etubu.app
---
- launchApp:
    clearState: true
    permissions:
      all: allow
      notifications: deny
    arguments:
      etubuSkipOnboarding: true
      etubuForcePremium: true
- runFlow: dismiss-permissions.yaml
- extendedWaitUntil:
    visible:
      id: "etubu.legal.checkbox"
    timeout: 20000
- tapOn:
    id: "etubu.legal.checkbox"
- tapOn:
    id: "etubu.legal.accept"
    optional: true
- tapOn:
    point: "50%,90%"
    optional: true
- runFlow: dismiss-permissions.yaml
- extendedWaitUntil:
    visible: "km/h"
    timeout: 25000
# Ses ikonu tek tuş: sessiz → açık → sessiz
- tapOn:
    id: "etubu.sound.off"
- extendedWaitUntil:
    visible:
      id: "etubu.sound.on"
    timeout: 3000
- tapOn:
    id: "etubu.sound.on"
- extendedWaitUntil:
    visible:
      id: "etubu.sound.off"
    timeout: 3000
- tapOn:
    id: "etubu.settings.open"
- extendedWaitUntil:
    visible: "Uygulama hakkında"
    timeout: 10000
- scrollUntilVisible:
    element:
      id: "etubu.demo.toggle"
    direction: DOWN
    timeout: 30000
- tapOn:
    id: "etubu.demo.toggle"
- waitForAnimationToEnd:
    timeout: 2500
- extendedWaitUntil:
    visible:
      id: "etubu.gear"
    timeout: 8000
- assertVisible:
    text: "D"
    id: "etubu.gear"
# Demo sesi açılır
- extendedWaitUntil:
    visible:
      id: "etubu.sound.on"
    timeout: 5000
# Mute sırasında demo tick sesi geri açmamalı
- tapOn:
    id: "etubu.sound.on"
- extendedWaitUntil:
    visible:
      id: "etubu.sound.off"
    timeout: 3000
- waitForAnimationToEnd:
    timeout: 2000
- assertVisible:
    id: "etubu.sound.off"
# Demo’yu bitir — kadran üzerindeki stop
- extendedWaitUntil:
    visible:
      id: "etubu.demo.stop"
    timeout: 10000
- tapOn:
    id: "etubu.demo.stop"
- waitForAnimationToEnd:
    timeout: 1500
- assertNotVisible:
    id: "etubu.demo.stop"
- assertNotVisible: "Demo’yu bitir"
- assertNotVisible: "^Demo$"
- assertNotVisible: "Demo bitti"
# Stop sonrası ses kapalı kalmalı
- assertVisible:
    id: "etubu.sound.off"
- takeScreenshot: demo-stopped-clean
