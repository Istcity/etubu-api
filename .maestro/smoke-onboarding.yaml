appId: com.etubu.app
---
# Legal + ana küme + rota (sim: skipOnboarding — Başla/Atla a11y ayrı iş)
- launchApp:
    clearState: true
    permissions:
      all: allow
      notifications: deny
    arguments:
      etubuSkipOnboarding: true
- runFlow: dismiss-permissions.yaml
- assertVisible: "Hüküm ve Koşullar"
- assertVisible: "Etubu"
- takeScreenshot: qa-01-legal
- runFlow: dismiss-permissions.yaml
- extendedWaitUntil:
    visible:
      id: "etubu.legal.checkbox"
    timeout: 15000
- tapOn:
    id: "etubu.legal.checkbox"
- waitForAnimationToEnd:
    timeout: 500
- tapOn:
    id: "etubu.legal.accept"
    optional: true
- tapOn:
    point: "50%,90%"
    optional: true
- waitForAnimationToEnd:
    timeout: 1500
- runFlow: dismiss-permissions.yaml
- extendedWaitUntil:
    visible:
      id: "etubu.settings.open"
    timeout: 25000
- assertNotVisible: "Hüküm ve Koşullar"
- takeScreenshot: qa-03-main
- assertVisible: "km/h"
- tapOn:
    id: "etubu.route.open"
- runFlow: dismiss-permissions.yaml
- extendedWaitUntil:
    visible: "Şehir / ilçe"
    timeout: 12000
- tapOn: "Şehir / ilçe"
- inputText: "Ankara"
- assertVisible: "Ankara"
- takeScreenshot: qa-04-route-typing
- tapOn: "Kapat"
- extendedWaitUntil:
    visible: "km/h"
    timeout: 8000
- assertVisible: "km/h"
- assertVisible: "FL"
- takeScreenshot: qa-05-main-tpms
