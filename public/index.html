<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0a1528" />
  <title>Etubu</title>
  <style>
    html, body { margin: 0; background: #0a1528; height: 100%; }
  </style>
  <script>
    // Native SwiftUI cluster owns launch / legal / location. Cap app loads only after arm.
    window.__ETUBU_NATIVE_CLUSTER__ = true;
    window.__ETUBU_GPS_ARMED__ = false;
    window.__ETUBU_LOAD_APP__ = function () {
      try {
        window.__ETUBU_GPS_ARMED__ = true;
        location.replace('index-app.html');
      } catch (e) {}
    };
  </script>
</head>
<body></body>
</html>
